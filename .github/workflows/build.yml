name: build-and-test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output artifacts/publish /p:UseAppHost=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amp2BeatWeaver-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/publish

  test-customs:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout customs repository
        uses: actions/checkout@v4
        with:
          repository: hmxmilohax/amp-2016-customs
          path: amp-2016-customs
          lfs: true

      - name: Build converter
        run: dotnet build --configuration Release

      - name: Convert all customs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t moggsongs < <(find "$GITHUB_WORKSPACE/amp-2016-customs/songs" -name '*.moggsong' | sort)
          test ${#moggsongs[@]} -gt 0

          folder_output="$RUNNER_TEMP/output-folder"
          moggsong_output="$RUNNER_TEMP/output-moggsong"
          zip_output="$RUNNER_TEMP/output-zip"
          mkdir -p "$folder_output" "$moggsong_output" "$zip_output"

          for moggsong in "${moggsongs[@]}"; do
            song_dir="$(dirname "$moggsong")"
            dotnet run --project "$GITHUB_WORKSPACE/Amp2BeatWeaver.csproj" -- "$song_dir" "$folder_output"
          done

          first_moggsong="${moggsongs[0]}"
          dotnet run --project "$GITHUB_WORKSPACE/Amp2BeatWeaver.csproj" -- "$first_moggsong" "$moggsong_output"

          first_song_dir="$(dirname "$first_moggsong")"
          zip_path="$RUNNER_TEMP/$(basename "$first_song_dir").zip"
          python3 - <<'PY' "$first_song_dir" "$zip_path"
          import os
          import sys
          import zipfile

          song_dir = sys.argv[1]
          zip_path = sys.argv[2]
          parent = os.path.dirname(song_dir)
          folder = os.path.basename(song_dir)
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root, _, files in os.walk(song_dir):
                  for name in files:
                      full_path = os.path.join(root, name)
                      relative = os.path.relpath(full_path, parent)
                      archive.write(full_path, relative)
          PY
          dotnet run --project "$GITHUB_WORKSPACE/Amp2BeatWeaver.csproj" -- "$zip_path" "$zip_output"
